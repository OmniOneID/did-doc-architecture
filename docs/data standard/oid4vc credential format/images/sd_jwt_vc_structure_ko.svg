7" fill="#FDF5E6" style="stroke:#555;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="229.51" y="503.944" fill="#000" font-size="13" textLength="98.985" font-weight="700" font-family="Arial">Disclosure i ... k</text><text x="229.51" y="518.893" fill="#000" font-size="13" textLength="75.642" font-family="Arial">Holder가 선택</text></g><!--entity U2--><g class="entity" data-qualified-name="PRE.U2" id="ent0026" data-source-line="47"><text x="360.91" y="511.782" fill="#000" font-size="14" font-weight="700" font-family="Arial">~</text></g><!--entity KB--><g class="entity" data-qualified-name="PRE.KB" id="ent0027" data-source-line="48"><rect x="391.17" y="466.8" width="161.661" height="79.795" fill="#F0FFF0" style="stroke:#555;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="401.17" y="488.994" fill="#000" font-size="13" textLength="50.546" font-weight="700" font-family="Arial">KB-JWT</text><text x="455.328" y="488.994" fill="#000" font-size="13" textLength="31.148" font-family="Arial">(선택)</text><text x="401.17" y="503.943" fill="#000" font-size="13" textLength="70.434" font-family="Arial">(typ: kb+jwt)</text><text x="401.17" y="518.891" fill="#000" font-size="13" textLength="141.661" font-family="Arial">aud, nonce, iat, sd_hash</text><text x="401.17" y="533.84" fill="#000" font-size="13" textLength="90.499" font-family="Arial">Holder 키로 서명</text></g><g class="entity" data-qualified-name="N1" id="ent0034" data-source-line="60"><path d="M304.39,630.59 L304.39,685.436 L849.611,685.436 L849.611,640.59 L839.611,630.59 L304.39,630.59" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M839.611,630.59 L839.611,640.59 L849.611,640.59 L839.611,630.59" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="310.39" y="647.784" fill="#000" font-size="13" textLength="364.718" font-family="Arial">digest = base64url(SHA-256(Disclosure)), Payload의 _sd에 포함</text><text x="310.39" y="662.733" fill="#000" font-size="13" textLength="524.221" font-family="Arial">sd_hash = ba