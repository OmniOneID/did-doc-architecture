="ent0007" data-source-line="25"><rect x="680" y="202.95" width="114.003" height="64.846" fill="#FDF5E6" style="stroke:#555;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="690" y="225.144" fill="#000" font-size="13" textLength="77.314" font-weight="700" font-family="Arial">Disclosure 1</text><text x="690" y="240.093" fill="#000" font-size="13" textLength="94.003" font-family="Arial">[salt, Claim 이름,</text><text x="693.612" y="255.041" fill="#000" font-size="13" textLength="51.692" font-family="Arial">Claim 값]</text></g><!--entity T2--><g class="entity" data-qualified-name="ISS.T2" id="ent0008" data-source-line="26"><text x="816.1" y="240.462" fill="#000" font-size="14" textLength="35.8" font-weight="700" font-family="Arial">~ ... ~</text></g><!--entity DN--><g class="entity" data-qualified-name="ISS.DN" id="ent0009" data-source-line="27"><rect x="874" y="202.95" width="114.003" height="64.846" fill="#FDF5E6" style="stroke:#555;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="884" y="225.144" fill="#000" font-size="13" textLength="79.473" font-weight="700" font-family="Arial">Disclosure N</text><text x="884" y="240.093" fill="#000" font-size="13" textLength="94.003" font-family="Arial">[salt, Claim 이름,</text><text x="887.612" y="255.041" fill="#000" font-size="13" textLength="51.692" font-family="Arial">Claim 값]</text></g><!--entity T3--><g class="entity" data-qualified-name="ISS.T3" id="ent0010" data-source-line="28"><text x="1009.91" y="240.462" fill="#000" font-size="14" font-weight="700" font-family="Arial">~</text></g><!--entity IH--><g class="entity" data-qualified-name="ISS.IJWT.IH" id="ent0003" data-source-line="20"><rect x="152.12" y="210.43" width="85.755" height="49.897" fill="#F5F5F5" style="stroke:#555;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="162.12" y="232.624" fill="#000" font-size="13" textLength="44.078" font-weight="700" font-family="Arial">Header</text><text x="162.12" y="247.573" fill="#000" font-size="13" textLength="65.755" font-family="Arial